<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Dolce Vita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Overlay de la vague pour la transition (de gauche à droite) -->
    <div id="wave-overlay" class="wave-container">
        <svg class="wave-svg" viewBox="0 24 150 28" preserveAspectRatio="none">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
                <use href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                <use href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                <use href="#gentle-wave" x="48" y="7" fill="#b8e0d2" />
            </g>
        </svg>
    </div>

    <!-- Carte centrale -->
    <main class="card">
        <div class="decorations">
            <span class="emoji lemon">🍋</span>
            <span class="emoji olive">🫒</span>
            <span class="emoji parasol">☂️</span>
        </div>

        <h1 class="title">La dolce vita</h1>
        <h2 class="subtitle">La vivre</h2>

        <a href="page2.html" id="transition-link" class="btn">Découvrir la suite 🌊</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
